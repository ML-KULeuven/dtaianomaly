[project]
name = "dtaianomaly"
dynamic = ["version"]
description = "A simple-to-use Python package for time series anomaly detection!"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Louis Carpentier", email = "louis.carpentier@kuleuven.be"}
]
keywords = ["machine-learning", "time-series", "anomaly-detection", "data-mining"]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.10",
    "numba>=0.58",
    "stumpy>=1.12",
    "scikit-learn>=1.3",
    "pandas>=1.3.0",
    "matplotlib>=3.7",
    "statsmodels>=0.6",
    "pyod>=2.0.0",
    "tslearn>=0.6.3",
    "sktime>=0.24",
    "torch>=1.8.0",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
homepage = "https://pypi.org/project/dtaianomaly/"
repository = "https://github.com/ML-KULeuven/dtaianomaly"
changelog = "https://github.com/ML-KULeuven/dtaianomaly/releases"
documentation = "https://dtaianomaly.readthedocs.io/en/stable/index.html"

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.0.0"  # builds without git metadata (e.g. source zip)

[tool.setuptools.packages.find]
include = ["dtaianomaly", "dtaianomaly.*"]  # alternatively: `exclude = ["additional*"]`
namespaces = false

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "slow: marks tests as slow",
    "numba: marks tests that depend on numba-compiled code"
]

# User-facing optional features, published on PyPI. The moment extra pins
# old versions of transformers and numpy (momentfm 0.1.4), and can therefore
# not be installed together with chronos or time_moe.
[project.optional-dependencies]
tqdm = [
    "tqdm"
]
chronos = [
    "autogluon.timeseries>=1.3.1"
]
moment = [
    "momentfm"
]
time_moe = [
    # The Time-MoE model code on the Hugging Face Hub only runs on transformers 4.40.x
    "transformers>=4.40.1,<4.41",
    "accelerate",
]

# Development tools (PEP 735), not published on PyPI.
# Install with `uv sync` (all groups) or `pip install . --group <name>` (pip>=25.1).
[dependency-groups]
tests = ["pytest", "pytest-cov"]
docs = ["sphinx", "sphinx-rtd-theme", "numpydoc", "sphinxcontrib-bibtex"]
lint = ["pre-commit", "black", "isort"]
notebooks = ["notebook", "jupyterlab"]

[tool.uv]
default-groups = "all"
# All three model extras are declared mutually exclusive. Only moment strictly
# conflicts with the others (chronos and time_moe can be combined with pip), but
# pairwise conflicts make uv resolve the default environment with momentfm's old
# numpy pin, which breaks `uv sync` on Python 3.12+.
conflicts = [
    [{extra = "chronos"}, {extra = "moment"}, {extra = "time_moe"}],
]
