name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name }}

jobs:

  ###################################################################
  # CHECK THE TAG FOR CORRECT FORMATTING
  ###################################################################
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check version format
        run: |
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version format is valid: $TAG"
          else
            echo "Version format is invalid: $TAG (expected X.Y.Z, without 'v' prefix)"
            exit 1
          fi

  ###################################################################
  # BUILD THE PROJECT
  ###################################################################
  build:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm needs the tags
          persist-credentials: false

      - name: Check that the tag is on main
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Commit $GITHUB_SHA is on main"
          else
            echo "Commit $GITHUB_SHA of tag $TAG is not on main"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v5

      - name: Build a binary wheel and a source tarball
        run: uv build

      - name: Check that the version matches the tag
        run: |
          ls dist/
          test -f "dist/dtaianomaly-$TAG.tar.gz"
          ls dist/dtaianomaly-"$TAG"-*.whl

      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  ###################################################################
  # PUBLISH TO PYPI
  ###################################################################
  publish:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/dtaianomaly

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  ###################################################################
  # ATTACH THE SIGNED DISTRIBUTIONS TO THE GITHUB RELEASE
  ###################################################################
  release-assets:
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for uploading release assets
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl

      - name: Upload artifact signatures to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
