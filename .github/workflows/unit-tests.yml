name: Unit test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # Test every supported Python version, so that version-specific changes
  # (such as the lazy annotations of Python 3.14) are caught early. The
  # versions are defined in the repository variable PYTHON_VERSIONS as a
  # JSON list, for example: ["3.11", "3.12", "3.13", "3.14"]
  unit-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(vars.PYTHON_VERSIONS) }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dtaianomaly
      run: |
        python -m pip install --upgrade pip
        pip install ".[tqdm]" --group tests
        pip list

    - name: Test with pytest
      run: pytest --cov=dtaianomaly --cov-report term-missing

  # The foundation-model extras conflict with each other, so each one is
  # installed and tested in its own environment (the regular tests mock them).
  optional-extras:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - {extra: chronos, test: test_Chronos.py, module: autogluon.timeseries}
          - {extra: moment, test: test_MOMENT.py, module: momentfm}
          - {extra: time_moe, test: test_TimeMoE.py, module: "transformers, accelerate"}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dtaianomaly[${{ matrix.extra }}]
      run: |
        python -m pip install --upgrade pip
        pip install ".[${{ matrix.extra }}]" --group tests
        pip list

    - name: Check installed dependencies
      run: |
        pip check
        python -c "import ${{ matrix.module }}"

    - name: Test with pytest
      run: pytest tests/anomaly_detection/${{ matrix.test }}
